# wiki 生成状态文件示例。
# 运行时制品写入 docs/.wiki-state.yaml。
# 对话压缩后信任状态文件不信任记忆。
# 完整规范见 references/state-ledger.md。

repo_path: "/path/to/repo"
mode: "full"                          # full（全面模式 8-12页） | lite（精简模式 4-6页）
incremental: false                    # true（增量更新） | false（全量生成）
git_hash: "a1b2c3d4"                  # scan_repo.py 输出的当前仓库 commit hash（无 git 则空）
started_at: "2026-07-14T10:00:00+08:00"

# 阶段标识符（稳定英文键，下游脚本按字面值匹配，不得改写为中文）
# status 闭集：pending | in_progress | complete | failed
# complete 当且仅当对应门禁通过
current_step: "generate_pages"       # 当前正在执行的步骤标识符

steps:
  cleanup:
    status: complete
    timestamp: "2026-07-14T10:00:00+08:00"

  scan_repo:
    status: complete
    output: "docs/tmp/wiki_scan.json"     # scan_repo.py 的输出文件路径
    timestamp: "2026-07-14T10:00:15+08:00"

  scan_api:
    status: complete
    output: "docs/tmp/wiki_api_entries.json"
    timestamp: "2026-07-14T10:00:30+08:00"

  generate_structure:
    status: complete
    output: "docs/tmp/wiki_structure.json"   # parse_structure.py 解析后的 JSON
    raw_xml: "docs/tmp/wiki_structure.xml"   # LLM 生成的原始 XML
    timestamp: "2026-07-14T10:01:00+08:00"

  generate_pages:
    status: in_progress
    total_pages: 10
    completed_count: 3
    skipped_count: 0
    failed_count: 0
    # 每个页面的详细状态
    pages:
      - id: "page-1"
        title: "项目概览"
        status: "complete"              # pending | in_progress | complete | failed | skipped
        source_hash: "a1b2c3d4e5f6"     # 源文件组合 hash（用于增量更新判断）
        output_file: "项目概览.md"       # 输出文件路径（相对于 docs/wiki/）
        completed_at: "2026-07-14T10:01:30+08:00"
      - id: "page-2"
        title: "系统架构"
        status: "complete"
        source_hash: "f6e5d4c3b2a1"
        output_file: "系统架构/整体架构.md"
        completed_at: "2026-07-14T10:02:00+08:00"
      - id: "page-3"
        title: "核心功能"
        status: "complete"
        source_hash: "1a2b3c4d5e6f"
        output_file: "核心功能/功能模块.md"
        completed_at: "2026-07-14T10:02:30+08:00"
      - id: "page-4"
        title: "数据管理"
        status: "in_progress"           # 正在生成
        source_hash: "6f5e4d3c2b1a"
        output_file: "数据管理/数据访问层.md"
      - id: "page-5"
        title: "部署配置"
        status: "pending"               # 尚未开始
        source_hash: "abcdef123456"
        output_file: "部署与运维/部署流程.md"
      - id: "page-6"
        title: "API 接口"
        status: "failed"                # 生成失败
        source_hash: "123456abcdef"
        output_file: "API 接口/接口文档.md"
        error: "LLM 生成超时"            # 失败原因
      - id: "page-7"
        title: "前端组件"
        status: "skipped"               # 增量模式下源文件未变化，跳过
        source_hash: "fedcba654321"     # 与上次相同
        output_file: "前端组件/页面结构.md"
        skip_reason: "source_hash_unchanged"

  export:
    status: pending                     # export_wiki.py 执行后标记 complete

  verify:
    status: pending                     # verify_wiki.py 执行后标记 complete
    # verify_wiki.py 的检查结果写入此处
    hard_gates_passed: null             # true | false | null（未执行）
    soft_gates_warnings: []             # 软门禁警告列表，每项为 { "check": "名称", "detail": "说明" }

  cleanup_tmp:
    status: pending                     # 清理临时文件后标记 complete
