# =============================================================================
# 应用设计契约模板 v2（app-contract.yaml）—— 统一契约格式（唯一产出格式）
# -----------------------------------------------------------------------------
# v2 覆盖所有 target_kind：
#   - backend-java / backend-python：作为后端 code-generation 的确定性输入，
#     surfaces 约定使用 api（接口 URL）/ biz（Biz 方法）/ service（Service 方法），
#     SOP 的 entry 即 Biz 编排方法（等价旧 bizMethod），calls 为按序 Service 调用。
#   - 其余 targetKind：作为 traceability contract，记录对象/行为/规则/SOP 到
#     应用表面的映射，不直接进入后端 code-generation。
# 字段约束见同目录 app-contract-v2.schema.json。
# 旧 legacy 格式（无 version 字段、project.backend.*）已弃用：存量项目只读兼容，
# 新契约一律按本模板产出。
# =============================================================================

version: 2

