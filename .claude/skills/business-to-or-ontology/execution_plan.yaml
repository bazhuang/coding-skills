skill: business-to-or-ontology

input_contract:
  business_ontology:
    semantic_role: 业务本体，承载运筹业务应用全景表达
    expected_content:
      - 对象/关系/流动语义
      - 目标/约束/规则口径
      - 非内核运行流程
  simulation_schema:
    semantic_role: 表 schema 或仿真表 schema
    expected_content:
      - 表结构与字段语义
      - 主键/唯一键/引用关系
      - 数据承载与粒度证据

substeps:
  - id: extract_signals
    purpose: 从业务全景表达中剥离运筹问题内核，形成可追溯的运筹信号清单
    include_inputs:
      - business_ontology
      - simulation_schema
    include_references:
      - references/需供运筹元模型.md
      - references/or_signal_inventory.schema.json
    task_appendix: |
      按 `SKILL.md` 的“抽取运筹信号”和“标准化规则”执行。
      本阶段只产出中间信号，不产出最终标准对象或 `or_ontology`。
      输出重点：高价值短证据、候选对象/目标/约束、结构化 `schema_evidence`、信息不足问题。
      关键检查：
      - 必须抽取时间粒度证据；仅有 date/datetime、开始/结束时间或时间窗口规则时，记录为信息不足。
      - `schema_evidence` 用表名和关键字段引用仿真表，结构化保留 `primary_key`、`unique_keys`、`foreign_keys`。
      - 候选约束逐条保留 `confidence`；语义明确的约束字段不得因表多而省略。
      - `business_ontology` 内嵌 schema 一律忽略；字段类型按 `simulation_schema` 原始数据库类型文本抽取。
    output_artifacts:
      - name: or_signal_inventory
        type: json
        schema_path: references/or_signal_inventory.schema.json

  - id: normalize_ontology
    purpose: 基于抽取结果完成标准化映射，并产出最终 or_ontology
    include_inputs:
      - simulation_schema
    include_artifacts:
      - extract_signals.or_signal_inventory
    include_references:
      - references/需供运筹元模型.md
      - references/本体映射.schema.json
      - references/or_ontology.schema.json
    task_appendix: |
      按 `SKILL.md` 的“标准化运筹本体”和“标准化规则”执行。
      本阶段以 `extract_signals.or_signal_inventory` 为主输入，以 `simulation_schema` 为结构核对依据；不重新发明上游未出现的核心对象、目标或约束。
      输出重点：映射依据、最终对象体系、目标系统、正式约束、schema 绑定与剩余 `open_questions`。
      关键检查：
      - `problem_frame.time_granularity` 必须明确；无法稳定确定时抛出阻断性问题。
      - 上游候选目标/约束必须落入正式结果，或在 `open_questions` 显式说明原因。
      - `attached.table_schema` 必须逐表完整转录原始 schema，保留字段顺序、原始类型、主键、唯一键和外键信息。
      - 能稳定识别唯一键或引用关系时，必须写入 `unique_keys` / `foreign_keys`；明显引用但被引用侧不稳定时写入 `open_questions`。
      - `business_ontology` 内嵌 schema 不得覆盖、拼接、删改、重命名或重写 `simulation_schema` 原表结构。
    output_artifacts:
      - name: ontology_mapping
        type: json
        schema_path: references/本体映射.schema.json
      - name: or_ontology
        type: json
        schema_path: references/or_ontology.schema.json
