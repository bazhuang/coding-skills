skill: or-ontology-spatial-path-query-embedding

input_contract:
  or_ont_time_discretized:
    semantic_role: 时间离散适配后的运筹算法本体，属于业务数据系统
    expected_content:
      - 问题框架
      - 算法对象
      - 目标系统
      - 约束系统
      - 映射依据
      - 待确认问题
  graph_modeling_sql:
    semantic_role: 图数据库建模 SQL，属于辅助路径系统
    expected_content:
      - 节点标签定义
      - 边类型定义
      - 节点属性映射
      - 边属性映射
      - version_id 字段承载方式
      - supply_node 到 demand_node 的可达关系证据
      - 未离散原始 schema 的表名或属性命名空间

substeps:
  - id: analyze_graph_path_query
    purpose: 从时间离散 or_ont 与图建模 SQL 中提取路径查询构件
    include_inputs:
      - or_ont_time_discretized
      - graph_modeling_sql
    include_references:
      - references/spatial-path-query-embedding-rules.md
      - references/graph_path_query_analysis.schema.json
    task_appendix: |
      本阶段只做路径查询构件分析，不输出最终 or_ont_path_query_embedded。
      必须区分两套数据库系统：or_ont_time_discretized 中的 table_schema 是业务数据系统，graph_modeling_sql 是图数据库路径系统。
      必须区分节点标签、边类型、属性表名和 version_id 过滤字段；无法稳定识别的内容写入 unresolved_gaps。
      graph_modeling_sql 可能来自未离散 schema，表名可与 or_ont 的离散化 schema 不同；这些差异只能用于生成路径查询模块，不得作为改写 or_ont 主体的依据。
      图数据库系统只用于获取路径连通性，不用于抽取供给量、需求量、价格、能力、最小量等建模数值。
    output_artifacts:
      - name: graph_path_query_analysis
        type: json
        schema_path: references/graph_path_query_analysis.schema.json

  - id: embed_path_queries
    purpose: 基于分析结果生成路径查询定义，并嵌入完整算法本体
    include_inputs:
      - or_ont_time_discretized
    include_artifacts:
      - analyze_graph_path_query.graph_path_query_analysis
    include_references:
      - references/spatial-path-query-embedding-rules.md
      - references/algorithm_ontology_path_query_embedded.schema.json
    task_appendix: |
      本阶段输出完整 or_ont_path_query_embedded，并在顶层新增 graph_path_query_system。
      查询语句中的版本条件必须使用 {version_id} 占位符，不得写入具体版本值。
      必须原样保留输入 or_ont_time_discretized 的主体内容；不得因为图 SQL 的表名、标签名、边类型或属性路径与 or_ont schema 不一致而修改 problem_frame、algorithm_objects、objective_system、constraint_system、mapping_rationale 或已有 open_questions。
      路径查询语句中的表名、标签名和属性路径遵循 graph_modeling_sql。
      graph_path_query_system 只描述从图数据库系统获取可行路径的方法，不改变业务数据系统中的对象 schema、目标、约束和数值字段。
      最终 path_queries 的核心参数必须用 path_parameters.start_nodes、path_parameters.end_nodes、path_parameters.path_edges 三个并列参数表达，不要把起点/终点写成对象详情而把边写成裸数组。
      默认跳数范围为 1..10，直接体现在 query_template 中；输入明确给出跳数范围时才覆盖。不要单独输出 confidence、hop_range、hop_parameter 或 hop_limit。
      中间推理过程、table_type 证据清单、mapping_basis、derivation_basis、downstream_usage 和详细 schema 差异说明只保留在 analyze_graph_path_query.graph_path_query_analysis 中；最终 or_ont_path_query_embedded 的 graph_path_query_system 只保留关键参数、最终查询模板和必要注解。
      不得访问图数据库、执行查询或生成路径结果。
    output_artifacts:
      - name: or_ont_path_query_embedded
        type: json
        schema_path: references/algorithm_ontology_path_query_embedded.schema.json
