substeps:
  - id: generate_time_config
    type: llm
    purpose: |
      从 or_ontology 中筛选出包含 time_dimension 的 node/edge 对象，
      生成 time_discretization_config.json 时间离散配置。
      生成后需按 time_discretization_config.schema.json 校验结构完整性，
      并结合 or_ontology 校验字段存在性（时间范围字段和量值字段在 table_schema.fields 中定义）、
      表名唯一性（结果表名不与 ontology 中现有表名冲突）、
      时间粒度为枚举值之一。
      校验不通过时重新生成配置，附带具体错误信息。
    include_inputs:
      - or_ontology
    output_artifacts:
      - name: time_discretization_config
        type: json

  - id: generate_code_and_ddl
    type: llm
    purpose: |
      基于校验通过的时间离散配置，生成 mysql_query.py、nebula_import.py、
      data_split.py、data_pipeline.py、discretized_schema.sql、
      discretized_ddl_executor.py。
      生成 discretized_schema.sql 时，需从 or_ontology 中读取对应对象的
      table_schema.fields 完整定义，按 DDL 生成规则逐项映射字段。
    include_artifacts:
      - generate_time_config.time_discretization_config
    include_inputs:
      - nebula_config
      - mysql_config
      - or_ontology
    output_artifacts:
      - name: mysql_query
        type: python
      - name: nebula_import
        type: python
      - name: data_split
        type: python
      - name: data_pipeline
        type: python
      - name: discretized_schema
        type: sql
      - name: discretized_ddl_executor
        type: python

  - id: execute_discretized_ddl
    type: action
    purpose: 将 discretized_schema.sql 中的 DDL 执行到 MySQL
    action: subprocess
    command:
      - "python3"
      - "{step_dir}/discretized_ddl_executor.py"
      - "--ddl-path"
      - "{step_dir}/discretized_schema.sql"
      - "--config-path"
      - "db/config/mysql_config.json"
    depends_on:
      - generate_code_and_ddl
    on_failure: abort
