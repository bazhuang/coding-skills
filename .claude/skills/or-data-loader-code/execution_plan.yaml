skill: or-data-loader-code

input_contract:
  or_ontology_time_discretized:
    semantic_role: 时间离散适配后的 or_ontology_time_discretized
    expected_content:
      - algorithm_objects.objects[*].table_schema
      - 目标表名
      - 字段清单
      - 主键
      - 可识别的 version_id 字段
  graph_path_queries:
    semantic_role: 图路径查询定义
    expected_content:
      - version_id_placeholder
      - path_queries[*].query_template
      - 查询模板中的 "{version_id}" 占位符

substeps:
  - id: extract_generation_spec
    purpose: 从外部输入和固定参考中抽取代码生成变量，不生成代码
    include_inputs:
      - or_ontology_time_discretized
      - graph_path_queries
    include_references:
      - references/data-loader-code-rules.md
      - references/mysql_config.schema.json
      - references/nebula_config.schema.json
      - references/graph_path_queries.schema.json
      - references/or_ontology_time_discretized.schema.json
      - references/data-loader-generation-spec.schema.json
    task_appendix: |
      本阶段只输出结构化生成规格，不输出 Python 代码。
      从 or_ontology_time_discretized.algorithm_objects.objects[*].table_schema 抽取 MySQL 表读取清单。
      表读取清单必须包含 table_name、columns、primary_key、version_field。
      若 table_schema.fields 中存在 version_id，则 version_field 使用 version_id；若本体明确表达了其他版本字段，则使用该字段；若表没有版本字段，则 version_field 为 null，并在生成代码中作为静态参考表读取。
      从 graph_path_queries.path_queries[*] 抽取 query_name 和 query_template。
      生成规格中 MySQL 配置默认路径固定为 db/config/mysql_config.json，NebulaGraph 配置默认路径固定为 db/config/nebula_config.json。
      graph_path_queries 不设置默认读取路径，生成代码运行时必须显式接收 graph_path_queries_path 或 query_config。
      不得连接 MySQL 或 NebulaGraph，不得读取实例数据，不得读取或写入实际数据库配置值。
    output_artifacts:
      - name: data_loader_generation_spec
        type: json
        schema_path: references/data-loader-generation-spec.schema.json

  - id: generate_code_bundle
    purpose: 基于生成规格和固定 Jinja2 模板生成三份运行态 Python 代码
    include_inputs:
      - table_loader_template
      - path_loader_template
      - data_loader_template
    include_artifacts:
      - extract_generation_spec.data_loader_generation_spec
    include_references:
      - references/data-loader-code-rules.md
      - references/data-loader-code-output.schema.json
    task_appendix: |
      本阶段输出 data_loader_code_bundle。
      必须生成且仅生成 table_loader.py、path_loader.py、data_loader.py 三个文件内容。
      稳定代码必须优先基于输入中的 Jinja2 模板内容渲染；必要的灵活部分只允许补充模板变量和局部适配逻辑。
      table_loader.py 只能从 MySQL 读取 tables。
      path_loader.py 只能从 NebulaGraph 读取 paths，并使用 graph_path_queries 的 query_template 和 {version_id} 占位符。
      path_loader.py 不得内置 graph_path_queries 默认路径。
      data_loader.py 只能组合 table_loader.py 和 path_loader.py。
      不得连接数据库，不得执行生成代码，不得读取或硬编码 mysql_config 或 nebula_config 的私密值。
    output_artifacts:
      - name: data_loader_code_bundle
        type: json
        schema_path: references/data-loader-code-output.schema.json

  - id: validate_code_bundle
    purpose: 对生成代码包做自检，修正明显边界问题后输出最终代码包
    include_artifacts:
      - extract_generation_spec.data_loader_generation_spec
      - generate_code_bundle.data_loader_code_bundle
    include_references:
      - references/data-loader-code-rules.md
      - references/data-loader-code-output.schema.json
    task_appendix: |
      本阶段输出最终 data_loader_code_bundle。
      必须检查并在必要时修正：
      1. files 是否正好包含 table_loader.py、path_loader.py、data_loader.py。
      2. table_loader.py 是否只从 MySQL 读取 tables。
      3. path_loader.py 是否只从 NebulaGraph 读取 paths。
      4. path_loader.py 是否要求显式传入 graph_path_queries_path 或 query_config，并替换 {version_id}。
      4a. path_loader.py 是否把每条 Nebula path 解析为 node_id, edge_id, node_id, ..., node_id 的业务主键序列。
      5. data_loader.py 是否返回 {"tables": ..., "paths": ...}。
      6. 代码中是否默认从 db/config/mysql_config.json 和 db/config/nebula_config.json 读取配置，且避免硬编码实际数据库配置值。
      7. 代码中是否没有连接数据库、读取实例数据或执行求解的生成期行为。
      输出仍必须满足 references/data-loader-code-output.schema.json。
    output_artifacts:
      - name: data_loader_code_bundle
        type: json
        schema_path: references/data-loader-code-output.schema.json
